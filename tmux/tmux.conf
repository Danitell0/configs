# tmux - workspaces for Ghostty, keys mirror ~/.config/nvim
# Prefix (Ctrl+Space) plays the role of <leader> (Space) in nvim.

# --- Core ---
set -g prefix C-Space
set -g prefix2 C-b               # fallback if C-Space is grabbed by the IME
bind C-Space send-prefix
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g escape-time 0             # no lag on Esc in nvim
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on          # yank goes to system clipboard via Ghostty
set -g set-titles on
set -g set-titles-string "#S:#W"

# --- Workspaces (i3/Hyprland style, no prefix) ---
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# --- Tabs (nvim: <tab>, <S-tab>, <leader><tab>, <leader>w) ---
bind Tab next-window
bind BTab previous-window
bind c new-window -c "#{pane_current_path}"
bind C display-popup -E -w 85% -h 75% -d "#{pane_current_path}" "~/.local/bin/ws code"   # pick a project, open a code workspace
bind w confirm-before -p "close workspace #W? (y/n)" kill-window
bind r command-prompt -I "#W" "rename-window '%%'"
bind W choose-tree -Zw           # list everything

# --- Panes (nvim: <leader>hjkl, <leader>v, <leader>x) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L       # faster: Alt+hjkl, no prefix
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind z resize-pane -Z            # zoom pane
bind X confirm-before -p "restart #{pane_current_command} in this pane? (y/n)" "run-shell '~/.local/bin/pane-restart #{pane_id}'"
bind C-l refresh-client          # redraw everything

# Resize (nvim: <C-arrows>) - repeatable after prefix
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- <leader>f... family, like Telescope / ToggleTerm ---
# prefix f d  -> file browser popup (yazi)
# prefix f t  -> floating terminal
# prefix f s  -> pick a session/workspace
bind f switch-client -T leader_f
bind -T leader_f d display-popup -E -w 85% -h 80% -d "#{pane_current_path}" yazi
bind -T leader_f t display-popup -E -w 85% -h 80% -d "#{pane_current_path}"
bind -T leader_f s choose-tree -Zs
bind t split-window -v -l 30% -c "#{pane_current_path}"   # <leader>t: bottom term
bind ? display-popup -E -w 90% -h 85% "~/.local/bin/keys"  # cheat sheet

# --- Copy mode (vim keys) ---
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-j send -X cancel   # nvim: <C-j> = escape

# Reload
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# --- Look: Solarized Dark, bar on top like waybar ---
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#073642,fg=#839496"
set -g status-left-length 30
set -g status-left "#[bg=#268bd2,fg=#002b36,bold] #S #[bg=#073642] "
set -g status-right-length 60
set -g status-right "#[fg=#586e75]? keys  #{?client_prefix,#[bg=#b58900 fg=#002b36 bold] LEADER #[default] ,}#[fg=#586e75]#(cut -d' ' -f1 /proc/loadavg)  #[fg=#2aa198]%a %d %b #[bg=#268bd2,fg=#002b36,bold] %H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#2aa198,fg=#002b36,bold] #I #W #{?window_zoomed_flag,󰊓 ,}"
setw -g window-status-separator ""
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#2aa198"
set -g message-style "bg=#073642,fg=#b58900"
set -g mode-style "bg=#268bd2,fg=#002b36"
set -g popup-border-style "fg=#2aa198"
set -g popup-border-lines rounded
